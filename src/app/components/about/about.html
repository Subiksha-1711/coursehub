<div class="container mt-5 py-4">

  <div class="row align-items-center mb-5">

    <div class="col-lg-6 mb-4 mb-lg-0">

      <h1 class="display-4 fw-bold text-primary mb-3">About CourseHub</h1>

      <p class="lead text-muted mb-4">
        CourseHub is a centralized course registration platform designed to simplify academic registration and management for students, faculty, and administrators.
      </p>

      <div class="d-flex gap-3">

        <a routerLink="/student-registration" class="btn btn-primary btn-lg">
          Get Started
        </a>

        <a routerLink="/" class="btn btn-outline-secondary btn-lg">
          Back to Dashboard
        </a>

      </div>

    </div>

    <div class="col-lg-6 text-center">

      <img
        src="/images/about.png"
        alt="About CourseHub Illustration"
        class="img-fluid rounded-4 shadow-sm max-illustration">

    </div>

  </div>

  <hr class="my-5 border-light">

  <h2 class="text-center mb-4 text-secondary">Core Platform Features</h2>

  <div class="row g-4">

    <div class="col-md-4" *ngFor="let feat of features">

      <div class="card h-100 hover-elevation border-0 text-center py-4 px-3">

        <div class="card-body">

          <div class="feature-icon-wrapper mb-3 mx-auto">
            <i class="bi" [ngClass]="feat.icon"></i>
          </div>

          <h4 class="card-title fw-semibold text-primary mb-3">{{ feat.title }}</h4>

          <p class="card-text text-muted">
            {{ feat.description }}
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
