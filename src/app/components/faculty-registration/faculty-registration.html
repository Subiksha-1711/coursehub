<div class="container mt-5 py-2">

  <div class="card shadow-sm border-0">

    <div class="card-header bg-success text-white py-3">
      <h3 class="card-title fw-bold mb-0"><i class="bi bi-person-video3 me-2"></i>Faculty Registration</h3>
    </div>

    <div class="card-body p-4">

      <form #facultyForm="ngForm" (ngSubmit)="registerFaculty(); facultyForm.resetForm()">

        <div class="row g-4">

          <!-- Faculty Name -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Faculty Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="Enter professor's full name"
                name="facultyName"
                [(ngModel)]="faculty.facultyName"
                required
                #name="ngModel"
                [class.is-invalid]="name.invalid && name.touched">
            </div>
            <div class="invalid-feedback" *ngIf="name.invalid && name.touched">
              Faculty name is required
            </div>
          </div>

          <!-- Employee ID -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Employee ID <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-card-text"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="e.g. EMP404"
                name="employeeId"
                [(ngModel)]="faculty.employeeId"
                required
                #empId="ngModel"
                [class.is-invalid]="empId.invalid && empId.touched">
            </div>
            <div class="invalid-feedback" *ngIf="empId.invalid && empId.touched">
              Employee ID is required
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control border-start-0 ps-0"
                placeholder="facultyname@university.edu"
                name="email"
                [(ngModel)]="faculty.email"
                required
                email
                #email="ngModel"
                [class.is-invalid]="email.invalid && email.touched">
            </div>
            <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
              Please enter a valid email address
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Phone Number <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-telephone"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="e.g. +1 (555) 000-0000"
                name="phone"
                [(ngModel)]="faculty.phone"
                required
                #phone="ngModel"
                [class.is-invalid]="phone.invalid && phone.touched">
            </div>
            <div class="invalid-feedback" *ngIf="phone.invalid && phone.touched">
              Phone number is required
            </div>
          </div>

          <!-- Department -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Department <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-building"></i></span>
              <input
                class="form-control border-start-0 ps-0"
                placeholder="e.g. Computer Science"
                name="department"
                [(ngModel)]="faculty.department"
                required
                #dept="ngModel"
                [class.is-invalid]="dept.invalid && dept.touched">
            </div>
            <div class="invalid-feedback" *ngIf="dept.invalid && dept.touched">
              Department is required
            </div>
          </div>

          <!-- Specialization -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Specialization Area <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-patch-check"></i></span>
              <input
                class="form-control border-start-0 ps-0"
                placeholder="e.g. Artificial Intelligence, Cryptography"
                name="specialization"
                [(ngModel)]="faculty.specialization"
                required
                #spec="ngModel"
                [class.is-invalid]="spec.invalid && spec.touched">
            </div>
            <div class="invalid-feedback" *ngIf="spec.invalid && spec.touched">
              Specialization is required
            </div>
          </div>

          <!-- Select Course Handling -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Course Handling <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-journal-bookmark"></i></span>
              <select
                class="form-select border-start-0 ps-0"
                name="course"
                [(ngModel)]="faculty.course"
                required
                #courseSel="ngModel"
                [class.is-invalid]="courseSel.invalid && courseSel.touched">
                <option value="">Select Course</option>
                <option *ngFor="let course of courses" [value]="course.courseName">
                  {{ course.courseCode }} - {{ course.courseName }}
                </option>
              </select>
            </div>
            <div class="invalid-feedback" *ngIf="courseSel.invalid && courseSel.touched">
              Course handling selection is required
            </div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Portal Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0"
                placeholder="Minimum 6 characters"
                name="password"
                [(ngModel)]="faculty.password"
                required
                minlength="6"
                #pwd="ngModel"
                [class.is-invalid]="pwd.invalid && pwd.touched">
            </div>
            <div class="invalid-feedback" *ngIf="pwd.invalid && pwd.touched">
              Password must be at least 6 characters
            </div>
          </div>

        </div>

        <div class="mt-5 text-end">
          <button
            class="btn btn-success px-5 py-2-5 shadow-sm"
            type="submit"
            [disabled]="facultyForm.invalid">
            <i class="bi bi-person-plus me-2"></i> Register Faculty
          </button>
        </div>

      </form>

    </div>

  </div>

</div>
