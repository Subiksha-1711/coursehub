<div class="container mt-5 py-2">

  <div class="card shadow-sm border-0">

    <div class="card-header text-white py-3" style="background-color: var(--primary-color);">
      <h3 class="card-title fw-bold mb-0"><i class="bi bi-mortarboard me-2"></i>Student Registration</h3>
    </div>

    <div class="card-body p-4">

      <form #studentForm="ngForm" (ngSubmit)="registerStudent()">

        <div class="row g-4">

          <!-- Name -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="Enter student's full name"
                name="name"
                [(ngModel)]="student.name"
                required
                #name="ngModel"
                [class.is-invalid]="name.invalid && name.touched">
            </div>
            <div class="text-danger small mt-1" *ngIf="name.invalid && name.touched">
              Full name is required
            </div>
          </div>

          <!-- Register Number -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Register Number <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-card-text"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="e.g. 21CS001"
                name="registerNumber"
                [(ngModel)]="student.registerNumber"
                required
                #regNo="ngModel"
                [class.is-invalid]="regNo.invalid && regNo.touched">
            </div>
            <div class="text-danger small mt-1" *ngIf="regNo.invalid && regNo.touched">
              Register number is required
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control border-start-0 ps-0"
                placeholder="studentname@university.edu"
                name="email"
                [(ngModel)]="student.email"
                required
                email
                #email="ngModel"
                [class.is-invalid]="email.invalid && email.touched">
            </div>
            <div class="text-danger small mt-1" *ngIf="email.invalid && email.touched">
              Please enter a valid email address
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Phone Number <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-telephone"></i></span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="e.g. +1 (555) 000-0000"
                name="phone"
                [(ngModel)]="student.phone"
                required
                #phone="ngModel"
                [class.is-invalid]="phone.invalid && phone.touched">
            </div>
            <div class="text-danger small mt-1" *ngIf="phone.invalid && phone.touched">
              Phone number is required
            </div>
          </div>

          <!-- Department -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Department <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-building"></i></span>
              <select
                class="form-select border-start-0 ps-0"
                name="department"
                [(ngModel)]="student.department"
                required
                #dept="ngModel"
                [class.is-invalid]="dept.invalid && dept.touched">
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>IT</option>
              </select>
            </div>
            <div class="text-danger small mt-1" *ngIf="dept.invalid && dept.touched">
              Department is required
            </div>
          </div>

          <!-- Year -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Academic Year</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar3"></i></span>
              <select
                class="form-select border-start-0 ps-0"
                name="year"
                [(ngModel)]="student.year">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
              </select>
            </div>
          </div>

          <!-- Select Course -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Enrolling Course <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-journal-bookmark"></i></span>
              <select
                class="form-select border-start-0 ps-0"
                name="course"
                [(ngModel)]="student.course"
                required
                #courseSel="ngModel"
                [class.is-invalid]="courseSel.invalid && courseSel.touched">
                <option value="">Select Course</option>
                <option *ngFor="let course of courses" [value]="course.courseName">
                  {{ course.courseCode }} - {{ course.courseName }} (Faculty: {{ course.facultyName }})
                </option>
              </select>
            </div>
            <div class="text-danger small mt-1" *ngIf="courseSel.invalid && courseSel.touched">
              Course selection is required
            </div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold small">Portal Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0"
                placeholder="Minimum 6 characters"
                name="password"
                [(ngModel)]="student.password"
                required
                minlength="6"
                #pwd="ngModel"
                [class.is-invalid]="pwd.invalid && pwd.touched">
            </div>
            <div class="text-danger small mt-1" *ngIf="pwd.invalid && pwd.touched">
              Password must be at least 6 characters
            </div>
          </div>

        </div>

        <div class="mt-5 text-end">
          <button
            class="btn btn-primary px-5 py-2-5 shadow-sm"
            type="submit"
            [disabled]="studentForm.invalid">
            <i class="bi bi-person-plus me-2"></i> Register Student
          </button>
        </div>

      </form>

    </div>

  </div>

</div>
